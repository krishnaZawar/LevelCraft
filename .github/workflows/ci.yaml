name: LevelCraft CI

on:
  push:
  workflow_dispatch:

env:
  GO_VERSION: "1.26.1"
  GOLANGCI_LINT_VERSION: "v2.14.0"

jobs:
  go-services:
    name: ${{ matrix.module.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
        - path: builder/backend
          name: builder-backend
        - path: editor/backend
          name: editor-backend
        - path: orchestrator
          name: orchestrator
        - path: utils
          name: utils

    steps:
      - name: Cloning Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Lint
        id: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module.path }}
          args: >-
            --output.text.path=stdout
            --output.json.path=lint-results/report.json

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # the echo job piped with sed allows the workflow to normalize the names for upload
          # like builder/backend would become builder-backend, the former throws error while the latter does not
          name: golangci-lint-report-${{ matrix.module.name }}
          path: ${{ matrix.module.path }}/lint-results/
          if-no-files-found: ignore

      - name: Test
        working-directory: ${{ matrix.module.path }}
        shell: bash
        run: |
          set -euo pipefail

          go vet ./...
          go test -cover ./...
          go build ./...