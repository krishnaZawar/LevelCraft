name: LevelCraft CI

on:
  push

jobs:
  lint-go-services:
    runs-on: ubuntu-latest

    steps:
      - name: Cloning Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Run golangci-lint
        run: |
          set -euo pipefail
          lint_failed=0
          for mod in $(find . -name go.mod); do
            dir=$(dirname "$mod")
            report=$(echo "$dir" | sed 's#^\./##; s#/#-#g')
            echo "=================================="
            echo "Linting $dir"
            echo "=================================="
            (
              cd "$dir"
              golangci-lint run \
                --output.text.path=stdout \
                  --output.json.path="$GITHUB_WORKSPACE/lint-results/${report}.json"
            ) || lint_failed=1
          done
          exit "${lint_failed}"

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golangci-lint-reports
          path: lint-results/
          retention-days: 7

  test-go-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Cloning Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true

      - name: Test Go modules
        shell: bash
        run: |
          set -euo pipefail
          for mod in $(find . -name go.mod); do
            dir=$(dirname "$mod")
            echo "=================================="
            echo "Testing $dir"
            echo "=================================="
            (
              cd "$dir"
              go vet ./...
              go test -cover ./...
              go build ./...
            )
          done

  lint-frontend-apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [editor/app, builder/app]

    steps:
      - name: Cloning Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      # The shared config is linked as a file: dependency, so Node resolves its
      # plugin imports from eslint-config/node_modules — installing only in the
      # app would leave ESLint unable to load them.
      - name: Install shared lint config
        working-directory: eslint-config
        run: npm ci

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Check formatting
        working-directory: ${{ matrix.app }}
        run: npm run format:check

      - name: Typecheck
        working-directory: ${{ matrix.app }}
        run: npm run typecheck

      - name: Run ESLint
        working-directory: ${{ matrix.app }}
        # Caching is for local runs; CI always lints the whole tree.
        run: npx eslint . --max-warnings 0
