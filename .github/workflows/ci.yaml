name: LevelCraft CI

on:
  push

jobs:
  lint-go-services:
    runs-on: ubuntu-latest

    steps:
      - name: Cloning Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Run golangci-lint
        run: |
          set -uo pipefail
          lint_failed=0
          for mod in $(find . -name go.mod); do
            dir=$(dirname "$mod")
            echo "=================================="
            echo "Linting $dir"
            echo "=================================="
            (
              cd "$dir"
              golangci-lint run
            ) || lint_failed=1
          done
          if [ "$lint_failed" -eq 1 ]; then
            echo "::warning::golangci-lint found issues"
          fi

  test-go-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Cloning Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true

      - name: Test Go modules
        shell: bash
        run: |
          set -euo pipefail
          for mod in $(find . -name go.mod); do
            dir=$(dirname "$mod")
            echo "=================================="
            echo "Testing $dir"
            echo "=================================="
            (
              cd "$dir"
              go vet ./...
              go test -cover ./...
              go build ./...
            )
          done