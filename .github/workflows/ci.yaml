name: LevelCraft CI

on:
  push

env:
  GO_VERSION: "1.26.1"
  GOLANGCI_LINT_VERSION: "v2.14.0"
  GO_MODULES: '[
      "builder/backend",
      "editor/backend",
      "orchestrator",
      "utils"
    ]'

jobs:
  discover-modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}

    steps:
      - name: Set Go modules
        id: set-modules
        run: echo "modules=${GO_MODULES}" >> "$GITHUB_OUTPUT"

  go-services:
    name: ${{ matrix.module }}
    needs: discover-modules
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover-modules.outputs.modules) }}

    steps:
      - name: Cloning Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Load golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Lint
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          set -euo pipefail

          report=$(echo "${{ matrix.module }}" | sed 's#^\./##; s#/#-#g')

          golangci-lint run \
            --output.text.path=stdout \
            --output.json.path="$GITHUB_WORKSPACE/lint-results/${report}.json"

      - name: Test
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          set -euo pipefail

          go vet ./...
          go test -cover ./...
          go build ./...

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golangci-lint-report-${{ matrix.module }}
          path: lint-results/
          if-no-files-found: ignore
          retention-days: 7