name: LevelCraft CI

on:
  push:
  workflow_dispatch:

env:
  GO_VERSION: "1.26.1"
  GOLANGCI_LINT_VERSION: "v2.14.0"

jobs:
  go-lint:
    name: ${{ matrix.module.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - path: builder/backend
            name: builder-backend
          - path: editor/backend
            name: editor-backend
          - path: orchestrator
            name: orchestrator
          - path: utils
            name: utils

    steps:
      - name: Cloning Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Lint
        id: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module.path }}
          args: >-
            --output.text.path=stdout
            --output.json.path=lint-results/report.json

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golangci-lint-report-${{ matrix.module.name }}
          path: ${{ matrix.module.path }}/lint-results/
          if-no-files-found: ignore
          retention-days: 7

  go-test:
    name: ${{ matrix.module.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - path: builder/backend
            name: builder-backend
          - path: editor/backend
            name: editor-backend
          - path: orchestrator
            name: orchestrator
          - path: utils
            name: utils

    steps:
      - name: Cloning Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Test
        working-directory: ${{ matrix.module.path }}
        shell: bash
        run: |
          set -euo pipefail

          go vet ./...
          go test -cover ./...
          go build ./...

  ci-success-verification-gate:
    name: CI Success Verifier
    if: always()
    needs:
      - go-lint
      - go-test
    runs-on: ubuntu-latest

    steps:
      - name: Check CI results
        run: |
          if [[ "${{ needs.go-lint.result }}" != "success" ||
                "${{ needs.go-test.result }}" != "failure" ]]; then
            echo "One or more CI checks failed."
            exit 1
          fi

          echo "All CI checks passed."