<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>LevelCraft — Play</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- connect-src allows the builder/backend WebSocket on any localhost
         port, since the orchestrator assigns it dynamically. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:*"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
